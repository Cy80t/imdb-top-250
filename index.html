<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Min IMDb Top 250</title>
<style>
:root {
  color-scheme: light dark;
  --bg:#f6f7f8; --card:#fff; --text:#171717; --muted:#6b7280; --border:#d1d5db; --accent:#2563eb;
}
@media (prefers-color-scheme:dark) {
  :root { --bg:#111827; --card:#1f2937; --text:#f9fafb; --muted:#9ca3af; --border:#374151; --accent:#60a5fa; }
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0 0 14px}
.toolbar,.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
button,input,select{font:inherit}
button,select,input{min-height:44px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);padding:9px 12px}
button{cursor:pointer}
button.active{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent)}
input{flex:1;min-width:200px}
select{flex:1;min-width:180px}
.meta-row{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:8px 0 12px;color:var(--muted);font-size:.9rem}
.list{display:grid;gap:8px}
.movie{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center;padding:10px;border:1px solid var(--border);border-radius:12px;background:var(--card)}
.movie-title{font-size:1rem}
.movie-title.seen{text-decoration:line-through;opacity:.65}
.movie-meta{margin-top:4px;font-size:.8rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.badge{border:1px solid var(--border);border-radius:999px;padding:2px 7px}
.icon-btn{padding:0;font-size:1.25rem}
.empty{padding:28px 0;text-align:center;color:var(--muted)}
.shared-banner{margin:10px 0 12px;padding:12px;border:1px solid var(--accent);border-radius:12px;background:var(--card)}
.shared-banner strong{display:block;margin-bottom:8px}
.shared-actions{display:flex;flex-wrap:wrap;gap:8px}
.status{min-height:1.2em;margin:6px 0 10px;color:var(--muted);font-size:.85rem}
.add-panel{margin:10px 0 12px;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--card)}
.add-panel[hidden]{display:none}
.add-form{display:grid;grid-template-columns:minmax(220px,2fr) minmax(100px,.7fr) minmax(160px,1fr) auto;gap:8px;align-items:end}
.add-form label{display:block;font-size:.78rem;color:var(--muted);margin:0 0 4px}
.add-form input{width:100%;min-width:0}
.add-submit{white-space:nowrap}
.own-badge{border:1px solid var(--accent);border-radius:999px;padding:2px 7px}
.delete-btn{min-height:28px;padding:2px 8px;font-size:.76rem;border-radius:8px}
.footer{margin-top:16px;font-size:.8rem;color:var(--muted)}
@media(max-width:700px){.add-form{grid-template-columns:1fr 1fr}.add-form .title-field{grid-column:1/-1}.add-submit{grid-column:1/-1}}
@media(max-width:520px){main{padding:12px} .movie{grid-template-columns:44px 1fr 44px;padding:8px}}
</style>
</head>
<body>
<main>
  <h1>Min IMDb Top 250</h1>
  <div class="toolbar">
    <button data-tab="priority">Se först <span id="count-priority"></span></button>
    <button data-tab="unseen" class="active">Osedda <span id="count-unseen"></span></button>
    <button data-tab="seen">Sedda <span id="count-seen"></span></button>
    <button data-tab="all">Alla <span id="count-all"></span></button>
    <button data-tab="mine">Mina filmer <span id="count-mine"></span></button>
    <button id="toggle-add" type="button">+ Lägg till film</button>
  </div>
  <div id="add-panel" class="add-panel" hidden>
    <form id="add-form" class="add-form">
      <div class="title-field">
        <label for="movie-title">Titel *</label>
        <input id="movie-title" type="text" required placeholder="Filmens titel">
      </div>
      <div>
        <label for="movie-year">År (valfritt)</label>
        <input id="movie-year" type="number" min="1888" max="2100" inputmode="numeric" placeholder="t.ex. 2024">
      </div>
      <div>
        <label for="movie-genre">Genre (valfritt)</label>
        <input id="movie-genre" type="text" list="genre-suggestions" placeholder="t.ex. Drama">
        <datalist id="genre-suggestions"></datalist>
      </div>
      <button class="add-submit" type="submit">Lägg till</button>
    </form>
  </div>
  <div class="filters">
    <input id="search" type="search" placeholder="Sök film…">
    <select id="genre"><option value="all">Alla genrer</option></select>
  </div>
  <div class="meta-row">
    <span id="result-count"></span>
    <div>
      <button id="share-list" type="button">Dela min lista</button>
      <button id="reset-filters" type="button">Nollställ filter</button>
    </div>
  </div>
  <div id="shared-banner" class="shared-banner" hidden>
    <strong>Du tittar på en delad lista.</strong>
    <div class="shared-actions">
      <button id="import-shared" type="button">Använd som min lista</button>
      <button id="close-shared" type="button">Tillbaka till min lista</button>
    </div>
  </div>
  <div id="status" class="status" aria-live="polite"></div>
  <div id="list" class="list"></div>
  <div id="empty" class="empty" hidden>Inga filmer matchar filtret.</div>
  <div class="footer">★ = se först · ✓ = sedd. Dina markeringar och egna filmer sparas lokalt i webbläsaren på den här enheten. När du delar listan följer både markeringar och egna filmer med i länken.</div>
</main>

const STORAGE_KEY = 'imdb250-watchlist-v1';
const CUSTOM_KEY = 'imdb250-custom-movies-v1';

let movies = RAW.trim().split('\n').map(line => {
  const [rank, genre, ...rest] = line.split('|');
  return { id:'imdb-'+rank, rank:Number(rank), genre, title:rest.join('|'), year:null, priority:false, seen:false, custom:false };
});

let sharedMode = false;

function loadCustomMovies() {
  try {
    const saved = JSON.parse(localStorage.getItem(CUSTOM_KEY) || '[]');
    if (!Array.isArray(saved)) return;
    saved.forEach((m,i) => {
      if (!m || !String(m.title || '').trim()) return;
      movies.push({
        id:String(m.id || ('custom-'+Date.now()+'-'+i)),
        rank:null,
        title:String(m.title).trim(),
        year:m.year ? Number(m.year) : null,
        genre:String(m.genre || '').trim(),
        priority:false,
        seen:false,
        custom:true,
        addedAt:Number(m.addedAt || Date.now())
      });
    });
  } catch(e) {}
}

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    movies.forEach(m => {
      const key = m.custom ? m.id : String(m.rank);
      const s = saved[key];
      if (s) { m.priority=!!s.priority; m.seen=!!s.seen; }
    });
  } catch(e) {}
}

function saveCustomMovies() {
  if (sharedMode) return;
  try {
    localStorage.setItem(CUSTOM_KEY, JSON.stringify(
      movies.filter(m=>m.custom).map(m=>({
        id:m.id, title:m.title, year:m.year || null, genre:m.genre || '', addedAt:m.addedAt || Date.now()
      }))
    ));
  } catch(e) {}
}

function saveState() {
  if (sharedMode) return;
  try {
    const saved = {};
    movies.forEach(m => {
      const key = m.custom ? m.id : String(m.rank);
      saved[key] = {priority:!!m.priority, seen:!!m.seen};
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
  } catch(e) {}
}

loadCustomMovies();
loadState();

function base64UrlEncode(text) {
  const bytes = new TextEncoder().encode(text);
  let binary='';
  bytes.forEach(b=>binary+=String.fromCharCode(b));
  return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/g,'');
}

function base64UrlDecode(text) {
  let b64=text.replace(/-/g,'+').replace(/_/g,'/');
  while(b64.length%4) b64+='=';
  const binary=atob(b64);
  const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function parseSharedState() {
  if (!location.hash) return null;
  const rawHash=location.hash.slice(1);

  if (rawHash.startsWith('share=')) {
    try {
      const payload=JSON.parse(base64UrlDecode(rawHash.slice(6)));
      return payload && payload.v===1 ? payload : null;
    } catch(e) { return null; }
  }

  const params=new URLSearchParams(rawHash);
  if (params.get('share')!=='1') return null;
  const nums=value=>(value || '').split(',').filter(Boolean).map(Number).filter(Number.isFinite);
  return {v:1,seen:nums(params.get('s')),priority:nums(params.get('p')),custom:[]};
}

function applySharedState(shared) {
  movies=movies.filter(m=>!m.custom);
  const seenSet=new Set((shared.seen || []).map(Number));
  const prioritySet=new Set((shared.priority || []).map(Number));

  movies.forEach(m=>{
    m.seen=seenSet.has(m.rank);
    m.priority=prioritySet.has(m.rank);
  });

  (shared.custom || []).forEach((m,i)=>{
    if (!m || !String(m.title || '').trim()) return;
    movies.push({
      id:String(m.id || ('shared-custom-'+i)),
      rank:null,
      title:String(m.title).trim(),
      year:m.year ? Number(m.year) : null,
      genre:String(m.genre || '').trim(),
      seen:!!m.seen,
      priority:!!m.priority,
      custom:true,
      addedAt:Number(m.addedAt || i)
    });
  });

  sharedMode=true;
}

const incomingShared=parseSharedState();
if (incomingShared) applySharedState(incomingShared);

function allGenres() {
  return [...new Set(movies.map(m=>(m.genre || '').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'sv'));
}

function updateGenreControls() {
  const selected=genre.value || 'all';
  genre.innerHTML='<option value="all">Alla genrer</option>';
  genreSuggestions.innerHTML='';

  allGenres().forEach(g=>{
    const o=document.createElement('option');
    o.value=g; o.textContent=g; genre.appendChild(o);

    const d=document.createElement('option');
    d.value=g; genreSuggestions.appendChild(d);
  });

  genre.value=[...genre.options].some(o=>o.value===selected) ? selected : 'all';
}

updateGenreControls();

function visible() {
  const q=search.value.trim().toLowerCase();
  return movies.filter(m=>{
    if(tab==='priority' && (!m.priority || m.seen)) return false;
    if(tab==='unseen' && m.seen) return false;
    if(tab==='seen' && !m.seen) return false;
    if(tab==='mine' && !m.custom) return false;
    if(genre.value!=='all' && m.genre!==genre.value) return false;

    const searchable=(m.title+' '+(m.year || '')+' '+(m.genre || '')).toLowerCase();
    if(q && !searchable.includes(q)) return false;
    return true;
  }).sort((a,b)=>{
    if(a.custom && b.custom) return (a.addedAt || 0)-(b.addedAt || 0);
    if(a.custom) return 1;
    if(b.custom) return -1;
    return a.rank-b.rank;
  });
}

function render() {
  sharedBanner.hidden=!sharedMode;
  document.getElementById('toggle-add').disabled=sharedMode;

  document.getElementById('count-priority').textContent='('+movies.filter(m=>m.priority&&!m.seen).length+')';
  document.getElementById('count-unseen').textContent='('+movies.filter(m=>!m.seen).length+')';
  document.getElementById('count-seen').textContent='('+movies.filter(m=>m.seen).length+')';
  document.getElementById('count-all').textContent='('+movies.length+')';
  document.getElementById('count-mine').textContent='('+movies.filter(m=>m.custom).length+')';

  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));

  const items=visible();
  resultCount.textContent=items.length+(items.length===1?' film':' filmer');
  list.innerHTML='';
  empty.hidden=items.length!==0;

  for(const m of items){
    const row=document.createElement('div'); row.className='movie';

    const star=document.createElement('button');
    star.className='icon-btn'; star.type='button';
    star.textContent=m.priority?'★':'☆';
    star.title=m.priority?'Ta bort från Se först':'Markera som Se först';
    star.addEventListener('click',()=>{m.priority=!m.priority;saveState();render();});

    const info=document.createElement('div');
    const title=document.createElement('div');
    title.className='movie-title'+(m.seen?' seen':'');
    title.textContent=m.title;

    const meta=document.createElement('div'); meta.className='movie-meta';

    if(m.custom){
      const own=document.createElement('span');
      own.className='own-badge'; own.textContent='Egen film';
      meta.appendChild(own);

      if(m.year){
        const year=document.createElement('span');
        year.textContent=String(m.year); meta.appendChild(year);
      }

      if(m.genre){
        const badge=document.createElement('span');
        badge.className='badge'; badge.textContent=m.genre; meta.appendChild(badge);
      }

      if(!sharedMode){
        const del=document.createElement('button');
        del.className='delete-btn'; del.type='button'; del.textContent='Ta bort';
        del.addEventListener('click',()=>{
          if(!confirm('Ta bort "'+m.title+'" från Mina filmer?')) return;
          movies=movies.filter(x=>x.id!==m.id);
          saveCustomMovies(); saveState(); updateGenreControls();
          statusEl.textContent='Filmen har tagits bort.';
          render();
        });
        meta.appendChild(del);
      }
    } else {
      const rank=document.createElement('span'); rank.textContent='IMDb #'+m.rank;
      const badge=document.createElement('span'); badge.className='badge'; badge.textContent=m.genre;
      meta.append(rank,badge);
    }

    info.append(title,meta);

    const seen=document.createElement('button');
    seen.className='icon-btn'; seen.type='button';
    seen.textContent=m.seen?'✓':'○';
    seen.title=m.seen?'Markera som osedd':'Markera som sedd';
    seen.addEventListener('click',()=>{m.seen=!m.seen;saveState();render();});

    row.append(star,info,seen); list.appendChild(row);
  }
}

document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{
  tab=b.dataset.tab; render();
}));
search.addEventListener('input',render);
genre.addEventListener('change',render);

document.getElementById('reset-filters').addEventListener('click',()=>{
  tab='unseen'; search.value=''; genre.value='all'; render();
});

document.getElementById('toggle-add').addEventListener('click',()=>{
  if(sharedMode) return;
  addPanel.hidden=!addPanel.hidden;
  if(!addPanel.hidden) movieTitle.focus();
});

addForm.addEventListener('submit',e=>{
  e.preventDefault();
  const title=movieTitle.value.trim();
  if(!title) return;

  const yearText=movieYear.value.trim();
  const genreText=movieGenre.value.trim();

  const m={
    id:'custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),
    rank:null,
    title,
    year:yearText ? Number(yearText) : null,
    genre:genreText,
    priority:false,
    seen:false,
    custom:true,
    addedAt:Date.now()
  };

  movies.push(m);
  saveCustomMovies(); saveState(); updateGenreControls();

  addForm.reset();
  addPanel.hidden=true;
  tab='mine';
  statusEl.textContent='"'+title+'" har lagts till i Mina filmer.';
  render();
});

function makeShareUrl() {
  const payload={
    v:1,
    seen:movies.filter(m=>!m.custom && m.seen).map(m=>m.rank),
    priority:movies.filter(m=>!m.custom && m.priority).map(m=>m.rank),
    custom:movies.filter(m=>m.custom).map(m=>({
      id:m.id,
      title:m.title,
      year:m.year || null,
      genre:m.genre || '',
      seen:!!m.seen,
      priority:!!m.priority,
      addedAt:m.addedAt || 0
    }))
  };

  return location.origin+location.pathname+location.search+'#share='+base64UrlEncode(JSON.stringify(payload));
}

document.getElementById('share-list').addEventListener('click',async()=>{
  const url=makeShareUrl();
  statusEl.textContent='';

  try{
    if(navigator.share){
      await navigator.share({title:'Min IMDb Top 250',text:'Här är min filmlista.',url});
    } else if(navigator.clipboard){
      await navigator.clipboard.writeText(url);
      statusEl.textContent='Delningslänken är kopierad.';
    } else {
      window.prompt('Kopiera den här länken:',url);
    }
  }catch(e){
    if(e && e.name==='AbortError') return;
    window.prompt('Kopiera den här länken:',url);
  }
});

document.getElementById('import-shared').addEventListener('click',()=>{
  sharedMode=false;
  saveCustomMovies(); saveState();
  history.replaceState(null,'',location.pathname+location.search);
  statusEl.textContent='Den delade listan är nu sparad som din lista på den här enheten.';
  updateGenreControls(); render();
});

document.getElementById('close-shared').addEventListener('click',()=>{
  movies=movies.filter(m=>!m.custom);
  movies.forEach(m=>{m.seen=false;m.priority=false;});

  sharedMode=false;
  loadCustomMovies(); loadState();

  history.replaceState(null,'',location.pathname+location.search);
  statusEl.textContent='Du är tillbaka i din egen lista.';
  updateGenreControls(); render();
});

render();
</script>
</body>
</html>
