<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Min IMDb Top 250</title>
<style>
:root {
  color-scheme: light dark;
  --bg:#f6f7f8; --card:#fff; --text:#171717; --muted:#6b7280; --border:#d1d5db; --accent:#2563eb;
}
@media (prefers-color-scheme:dark) {
  :root { --bg:#111827; --card:#1f2937; --text:#f9fafb; --muted:#9ca3af; --border:#374151; --accent:#60a5fa; }
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0 0 14px}
.toolbar,.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
button,input,select{font:inherit}
button,select,input{min-height:44px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);padding:9px 12px}
button{cursor:pointer}
button.active{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent)}
input{flex:1;min-width:200px}
select{flex:1;min-width:180px}
.meta-row{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:8px 0 12px;color:var(--muted);font-size:.9rem}
.list{display:grid;gap:8px}
.movie{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center;padding:10px;border:1px solid var(--border);border-radius:12px;background:var(--card)}
.movie-title{font-size:1rem}
.movie-title.seen{text-decoration:line-through;opacity:.65}
.movie-meta{margin-top:4px;font-size:.8rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.badge{border:1px solid var(--border);border-radius:999px;padding:2px 7px}
.icon-btn{padding:0;font-size:1.25rem}
.empty{padding:28px 0;text-align:center;color:var(--muted)}
.footer{margin-top:16px;font-size:.8rem;color:var(--muted)}
@media(max-width:520px){main{padding:12px} .movie{grid-template-columns:44px 1fr 44px;padding:8px}}
</style>
</head>
<body>
<main>
  <h1>Min IMDb Top 250</h1>
  <div class="toolbar">
    <button data-tab="priority">Se först <span id="count-priority"></span></button>
    <button data-tab="unseen" class="active">Osedda <span id="count-unseen"></span></button>
    <button data-tab="seen">Sedda <span id="count-seen"></span></button>
    <button data-tab="all">Alla <span id="count-all"></span></button>
  </div>
  <div class="filters">
    <input id="search" type="search" placeholder="Sök film…">
    <select id="genre"><option value="all">Alla genrer</option></select>
  </div>
  <div class="meta-row">
    <span id="result-count"></span>
    <button id="reset-filters" type="button">Nollställ filter</button>
  </div>
  <div id="list" class="list"></div>
  <div id="empty" class="empty" hidden>Inga filmer matchar filtret.</div>
  <div class="footer">★ = se först · ✓ = sedd. Dina markeringar sparas lokalt i webbläsaren på den här enheten.</div>
</main>

const STORAGE_KEY = 'imdb250-watchlist-v1';

let movies = RAW.trim().split('\n').map(line => {
  const [rank, genre, ...rest] = line.split('|');
  return { rank:Number(rank), genre, title:rest.join('|'), priority:false, seen:false };
});

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    movies.forEach(m => {
      const s = saved[m.rank];
      if (s) { m.priority = !!s.priority; m.seen = !!s.seen; }
    });
  } catch(e) {}
}
function saveState() {
  try {
    const out = {};
    movies.forEach(m => out[m.rank] = {priority:m.priority, seen:m.seen});
    localStorage.setItem(STORAGE_KEY, JSON.stringify(out));
  } catch(e) {}
}

loadState();

let tab = 'unseen';
const list = document.getElementById('list');
const empty = document.getElementById('empty');
const search = document.getElementById('search');
const genre = document.getElementById('genre');
const resultCount = document.getElementById('result-count');

[...new Set(movies.map(m=>m.genre))].sort().forEach(g => {
  const o=document.createElement('option'); o.value=g; o.textContent=g; genre.appendChild(o);
});

function visible() {
  const q=search.value.trim().toLowerCase();
  return movies.filter(m => {
    if(tab==='priority' && (!m.priority || m.seen)) return false;
    if(tab==='unseen' && m.seen) return false;
    if(tab==='seen' && !m.seen) return false;
    if(genre.value!=='all' && m.genre!==genre.value) return false;
    if(q && !m.title.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>a.rank-b.rank);
}

function render() {
  document.getElementById('count-priority').textContent='('+movies.filter(m=>m.priority&&!m.seen).length+')';
  document.getElementById('count-unseen').textContent='('+movies.filter(m=>!m.seen).length+')';
  document.getElementById('count-seen').textContent='('+movies.filter(m=>m.seen).length+')';
  document.getElementById('count-all').textContent='('+movies.length+')';

  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));

  const items=visible();
  resultCount.textContent=items.length+(items.length===1?' film':' filmer');
  list.innerHTML='';
  empty.hidden=items.length!==0;

  for(const m of items){
    const row=document.createElement('div'); row.className='movie';

    const star=document.createElement('button');
    star.className='icon-btn'; star.type='button';
    star.textContent=m.priority?'★':'☆';
    star.title=m.priority?'Ta bort från Se först':'Markera som Se först';
    star.addEventListener('click',()=>{m.priority=!m.priority;saveState();render();});

    const info=document.createElement('div');
    const title=document.createElement('div');
    title.className='movie-title'+(m.seen?' seen':'');
    title.textContent=m.title;
    const meta=document.createElement('div'); meta.className='movie-meta';
    const rank=document.createElement('span'); rank.textContent='IMDb #'+m.rank;
    const badge=document.createElement('span'); badge.className='badge'; badge.textContent=m.genre;
    meta.append(rank,badge); info.append(title,meta);

    const seen=document.createElement('button');
    seen.className='icon-btn'; seen.type='button';
    seen.textContent=m.seen?'✓':'○';
    seen.title=m.seen?'Markera som osedd':'Markera som sedd';
    seen.addEventListener('click',()=>{m.seen=!m.seen;saveState();render();});

    row.append(star,info,seen); list.appendChild(row);
  }
}

document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render();}));
search.addEventListener('input',render);
genre.addEventListener('change',render);
document.getElementById('reset-filters').addEventListener('click',()=>{
  tab='unseen'; search.value=''; genre.value='all'; render();
});
render();
</script>
